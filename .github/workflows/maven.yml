name: CI / Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: '发布 tag 名（如 v1.5.0）'
        required: false
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write  # release 需要写权限

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and test
      run: mvn -B -ntp clean package
      env:
        # 延长依赖下载超时，避免 GitHub 网络波动导致失败
        MAVEN_OPTS: -Dmaven.wagon.http.connectionTimeout=120000 -Dmaven.wagon.http.readTimeout=120000

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: target/surefire-reports/
        if-no-files-found: ignore

    - name: Extract version
      if: success()
      id: ver
      shell: bash
      run: echo "version=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

    - name: Upload build artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: burp-ai-analyzer-${{ steps.ver.outputs.version }}
        path: target/*.jar
        if-no-files-found: error

    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d7d7f
      continue-on-error: true  # 依赖图提交失败不影响主构建

  release:
    # 只有打 tag（v*）或手动指定 release 名时才发布
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build (skip tests, already ran)
      run: mvn -B -ntp clean package -DskipTests
      env:
        MAVEN_OPTS: -Dmaven.wagon.http.connectionTimeout=120000 -Dmaven.wagon.http.readTimeout=120000

    - name: Determine release tag
      id: tag
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "tag=${{ inputs.release }}" >> "$GITHUB_OUTPUT"
        else
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
        fi

    - name: Extract changelog for this release
      id: changelog
      shell: bash
      run: |
        # 取 CHANGELOG.md 里本版本段落（## [tag] … 下一个 ## 之前）
        TAG="${{ steps.tag.outputs.tag }}"
        awk -v tag="$TAG" '
          $0 ~ "^## \\[?"substr(tag,2)"\\]?" { inblk=1; next }
          inblk && /^## / { exit }
          inblk { print }
        ' CHANGELOG.md > body.md || true
        if [ ! -s body.md ]; then
          echo "Release $TAG" > body.md
        fi

    - name: Create release and upload jar
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        TAG="${{ steps.tag.outputs.tag }}"
        gh release create "$TAG" \
          target/ai-analyzer-*.jar \
          --title "Burp AI Analyzer $TAG" \
          --notes-file body.md \
          --latest
